services:
  api:
    build: .
    container_name: ctf-platform-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ctf:ctfpassword@db:5432/ctf_platform
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  db:
    image: postgres:17-alpine
    container_name: ctf-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctf_platform
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctfpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
